# Runs the build and every unit test on each push and pull request, so a broken change shows a red cross on GitHub
# before it reaches main (and Render). Pull requests into main also build the Docker image, like Render does.
name: CI

on:
  push:
    branches: [dev, main, "feat/**", "fix/**", "docs/**", "chore/**"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        run: mvn -B -ntp clean verify

  docker:
    name: Docker image builds
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: docker build
        run: docker build -t lavrel-backend:ci .

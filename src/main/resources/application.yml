server:
  # Cloud Run (and most container hosts) tell the app which port to use in PORT; 8080 locally.
  port: ${PORT:8080}

spring:
  application:
    name: lavrel-backend
  config:
    # Reads the variables of a .env file in the project root (plain NAME=value lines)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH}
  steam:
    api-key: ${STEAM_API_KEY}
    # Signs the account-link "state" (all platforms; app.link.state-secret would take precedence if set)
    state-secret: ${STEAM_STATE_SECRET}
    # /api/platforms/steam/callback works too
    callback-url: ${STEAM_CALLBACK_URL:http://localhost:8080/api/steam/callback}
  frontend:
    # Empty while there is no frontend: the link callback then answers with JSON.
    # Set: the browser is redirected to {base-url}/{platform}/linked?status=...
    base-url: ${FRONTEND_BASE_URL:}
  cors:
    # Browser origins allowed to call the API (comma-separated). 4200 = the Angular dev server.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  dev:
    fake-data-enabled: ${FAKE_DATA_ENABLED:false}
    # One-time e-mail verification for test accounts that cannot receive mail. Leave it commented out;
    # enable it only while needed (Postman 1 -> 26 -> 1), then comment it out again and restart.
    # verify-email-uids: <your Firebase UID>
  stats:
    # Country percentages are hidden below this many players
    min-country-sample: 20
  sync:
    # New games imported per account sync; the user syncs again to continue (gamesPending)
    max-imports-per-sync: 50
  catalog:
    min-reviews: 50                 # bulk seeding only
    failure-retry-days: 30          # rejected apps are not asked about again for this long
    import-delay-ms: 500            # pause between Steam calls (syncs, explicit lists, enrich, refresh)
    seed-delay-ms: 1000             # pause between Steam calls while walking the full Steam list
    filter:
      # The content policy (ContentPolicy). These are the defaults, written out so they can be tuned here.
      enabled: true
      required-type: game
      rejected-descriptor-ids: 3            # Adults Only Sexual Content: always rejected
      strict-descriptor-ids: 4              # Frequent Nudity or Sexual Content: rejected only with a sexual tag...
      strict-descriptor-max-rank: 3         # ...among the game's top 3 tags
      sexual-tag-ids: 12095,6650            # Sexual Content, Nudity
      normalization-count: 5                # tag share is measured against the top 5 tags' weight
      reject-share: 0.20                    # a sexual tag in the top 3 holding >= 20 % of that weight rejects
      reject-max-rank: 3
      excluded-tag-ids: 9130,6653           # Hentai, at any rank (Visual Novel and Match 3 are allowed on purpose)
      excluded-genres: Hentai

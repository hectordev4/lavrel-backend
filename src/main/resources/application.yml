spring:
  application:
    name: lavrel-backend
  config:
    # Reads the variables of a .env file in the project root (plain NAME=value lines)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH}
  steam:
    api-key: ${STEAM_API_KEY}
    state-secret: ${STEAM_STATE_SECRET}
    callback-url: ${STEAM_CALLBACK_URL:http://localhost:8080/api/steam/callback}
  frontend:
    # Empty while there is no frontend: the Steam callback then answers with JSON
    base-url: ${FRONTEND_BASE_URL:}
  admin:
    # Comma-separated Firebase UIDs allowed to call /api/admin/**. Empty: nobody.
    firebase-uids: ${ADMIN_FIREBASE_UIDS:}
  dev:
    fake-data-enabled: ${FAKE_DATA_ENABLED:false}
  stats:
    # Country percentages are hidden below this many players
    min-country-sample: 20
  sync:
    # New games imported per account sync; the user syncs again to continue (gamesPending)
    max-imports-per-sync: 50
  catalog:
    content-filter: ${CATALOG_CONTENT_FILTER:standard}   # off | standard | strict
    sexual-tag-top-rank: 5          # Sexual Content / Nudity tags within the top N tags block a game...
    sexual-tag-weight-ratio: 0.6    # ...or with at least this share of the top tag's weight
    min-reviews: 50                 # bulk seeding only
    failure-retry-days: 30          # rejected apps are not asked about again for this long
    import-delay-ms: 500            # pause between Steam calls (syncs, explicit lists, enrich, refresh)
    seed-delay-ms: 1000             # pause between Steam calls while walking the full Steam list
